<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="ropeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Inner Border Glow -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Gallows Structure (Arcade style) -->
  <g filter="url(#dropShadow)">
    <!-- Base Platform -->
    <path d="M 80 430 L 260 430" stroke="url(#woodGrad)" stroke-width="26" stroke-linecap="round"/>
    <!-- Vertical Post -->
    <path d="M 150 430 L 150 110" stroke="url(#woodGrad)" stroke-width="26" stroke-linecap="round"/>
    <!-- Diagonal Support -->
    <path d="M 150 190 L 210 110" stroke="url(#woodGrad)" stroke-width="16" stroke-linecap="round"/>
    <!-- Top Horizontal Beam -->
    <path d="M 135 110 L 370 110" stroke="url(#woodGrad)" stroke-width="26" stroke-linecap="round"/>
    <!-- Rope -->
    <path d="M 345 110 L 345 180" stroke="url(#ropeGrad)" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Arcade Character / Hangman in cute 4U style -->
  <g filter="url(#dropShadow)">
    <!-- Head -->
    <circle cx="345" cy="225" r="38" fill="#ffffff" stroke="#fbbf24" stroke-width="8"/>
    <!-- Joyful Eyes -->
    <circle cx="332" cy="220" r="5" fill="#4f46e5"/>
    <circle cx="358" cy="220" r="5" fill="#4f46e5"/>
    <!-- Smile -->
    <path d="M 333 238 Q 345 250 357 238" fill="none" stroke="#db2777" stroke-width="5" stroke-linecap="round"/>
    <!-- Body -->
    <line x1="345" y1="265" x2="345" y2="345" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="345" y1="285" x2="300" y2="315" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="345" y1="285" x2="390" y2="315" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="345" y1="345" x2="310" y2="400" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
    <line x1="345" y1="345" x2="380" y2="400" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- 4U Badge -->
  <rect x="360" y="420" width="110" height="52" rx="16" fill="#1e1b4b" fill-opacity="0.8" stroke="#38bdf8" stroke-width="3"/>
  <text x="415" y="456" fill="#38bdf8" font-family="'Nunito', sans-serif" font-weight="900" font-size="28" text-anchor="middle">4U</text>
</svg>
